[project]
name = "frio-agent"
version = "0.0.1"
description = "Frío — autonomous TikTok-Shop POD/Dropshipping agent (shared engine + two pipelines)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "typer>=0.9",
]

[project.optional-dependencies]
# Heavier deps are pulled in per-phase so Phase 0 stays light and runnable.
orchestration = ["prefect>=2"]
llm = ["anthropic>=0.30"]
http = ["httpx>=0.27", "tenacity>=8"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
deploy = ["fastapi>=0.110", "uvicorn>=0.27", "psycopg2-binary>=2.9"]  # hosted dashboard + Postgres
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
frio = "frio.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["frio*"]
