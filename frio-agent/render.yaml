# Render.com blueprint — hosted Frío dashboard + shared Postgres.
# (Paths are relative to the repo root. To use as a Blueprint, copy this file to the
#  repo root, or follow the manual steps in DEPLOY.md.)
databases:
  - name: frio-db
    plan: free

services:
  - type: web
    name: frio-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./frio-agent/Dockerfile
    dockerContext: ./frio-agent
    healthCheckPath: /healthz
    envVars:
      - key: FRIO_DATABASE_URL          # shared DB: agent writes, dashboard reads
        fromDatabase:
          name: frio-db
          property: connectionString
      - key: FRIO_DASHBOARD_PASSWORD     # set this yourself (secret) — strong password
        sync: false
      - key: FRIO_DASHBOARD_SESSION_SECRET  # signs login cookies; Render auto-generates
        generateValue: true
      - key: FRIO_DASHBOARD_SECURE_COOKIES  # HTTPS-only cookies (Render provides HTTPS)
        value: "1"
